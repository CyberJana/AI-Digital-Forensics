[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-forensics"
version = "0.1.0"
description = "AI Digital Forensics investigation platform API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "authlib>=1.4,<2.0",
    "boto3>=1.35,<2.0",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "itsdangerous>=2.2,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
digital-forensics-bootstrap = "digital_forensics.bootstrap:main"
digital-forensics-hash = "digital_forensics.hashing:main"
digital-forensics-worker = "digital_forensics.worker:main"
digital-forensics-copy = "digital_forensics.working_copy:main"
