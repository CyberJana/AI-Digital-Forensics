name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-build.lock
            backend/requirements-dev.lock
            backend/requirements-pip.lock
      - run: python -m pip install --require-hashes -r backend/requirements-pip.lock
      - run: python -m pip install --require-hashes -r backend/requirements-build.lock -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e backend
      - run: python -m pytest
        working-directory: backend
      - run: bandit --quiet --recursive src
        working-directory: backend
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file backend/Dockerfile --tag ai-digital-forensics-api:ci .
      - run: docker build --file frontend/Dockerfile --tag ai-digital-forensics-frontend:ci .
