name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-build.lock
            backend/requirements-dev.lock
            backend/requirements-pip.lock
      - run: python -m pip install --require-hashes -r backend/requirements-pip.lock
      - run: python -m pip install --require-hashes -r backend/requirements-build.lock -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e backend
      - run: python -m pytest
        working-directory: backend
      - run: bandit --quiet --recursive src
        working-directory: backend
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file backend/Dockerfile --tag ai-digital-forensics-api:ci .
      - run: docker build --file frontend/Dockerfile --tag ai-digital-forensics-frontend:ci .
      - run: docker build --file postgres/Dockerfile --tag ai-digital-forensics-postgres:ci .
      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ai-digital-forensics-api:ci
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ai-digital-forensics-frontend:ci
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
      - name: Scan PostgreSQL image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ai-digital-forensics-postgres:ci
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
